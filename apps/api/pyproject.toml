[project]
name = "tasksignal"
version = "1.0.0a1"
description = "FastAPI backend for TaskSignal, an AI-assisted problem discovery engine."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yurii Bakurov" }]
keywords = ["research", "evidence", "indie-builder", "mcp", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "alembic>=1.13.0",
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "platformdirs>=4.3,<5",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0"
]

[project.scripts]
tasksignal = "app.cli:main"

[project.urls]
Homepage = "https://github.com/Yurii201811/tasksignal"
Documentation = "https://github.com/Yurii201811/tasksignal#readme"
Issues = "https://github.com/Yurii201811/tasksignal/issues"
Source = "https://github.com/Yurii201811/tasksignal"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.resources.fixtures" = ["*.json"]

[tool.vercel]
entrypoint = "app.main:app"

[project.optional-dependencies]
dev = [
  "httpx2>=2.0.0",
  "mcp>=1.28.1,<2",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]
ml = [
  "scikit-learn>=1.5.0",
  "sentence-transformers>=3.0.0"
]
mcp = [
  "mcp>=1.28.1,<2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
