[project]
name = "tasksignal-api"
version = "0.2.0"
description = "FastAPI backend for TaskSignal, an AI-assisted problem discovery engine."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "apscheduler>=3.10.4",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.vercel]
entrypoint = "app.main:app"

[project.optional-dependencies]
dev = [
  "httpx2>=2.0.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]
ml = [
  "scikit-learn>=1.5.0",
  "sentence-transformers>=3.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
