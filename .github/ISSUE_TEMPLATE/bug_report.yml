name: Bug report
description: Report a reproducible TaskSignal problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TaskSignal. Please do not include secrets, private datasets, raw usernames, or real exported credentials.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Start the app with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, browser, database, and whether this used fixture or live data.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, secrets, personal data, and private source records.
      render: shell
