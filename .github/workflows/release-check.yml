name: Release readiness

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run release-readiness checks
        run: |
          mkdir -p release-artifacts
          python3 scripts/release_check.py | tee release-artifacts/release-check.txt
      - name: Upload release-readiness report
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-report
          path: release-artifacts/release-check.txt
