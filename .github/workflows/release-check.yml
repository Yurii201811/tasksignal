name: Release readiness

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release-readiness checks
        run: python3 scripts/release_check.py
