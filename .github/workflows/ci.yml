name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --project apps/api --extra dev --locked
      - run: uv run --project apps/api --extra dev --locked ruff check apps/api/app apps/api/tests
      - run: uv run --project apps/api --extra dev --locked pytest apps/api/tests
        env:
          DATABASE_URL: sqlite:///./test_tasksignal.db
          AUTO_CREATE_TABLES: "true"
          LLM_PROVIDER: none

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
